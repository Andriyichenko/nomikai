# Every morning at 08:00 JST: mail everyone attending a party that is happening today.
# Needs repository secrets SITE_URL (the deployed site, e.g. https://nomikai.example.com) and CRON_SECRET.
name: Day-of reminder

on:
  schedule:
    - cron: "0 23 * * *" # 08:00 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the reminder endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "::error::Set the SITE_URL and CRON_SECRET repository secrets"
            exit 1
          fi
          code=$(curl -sS -o body.json -w '%{http_code}' "${SITE_URL%/}/api/cron/day-of" -H "Authorization: Bearer ${CRON_SECRET}" || echo "000")
          echo "HTTP ${code}: $(cat body.json 2>/dev/null || true)"
          [ "${code}" = "200" ]
