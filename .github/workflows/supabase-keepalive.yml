# Free Supabase projects are paused after 7 days without activity.
# This runs a tiny read query once a day so the nomikai project stays awake.
# Needs repository secrets SUPABASE_URL and SUPABASE_ANON_KEY (the publishable key).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 0 * * *" # every day 09:17 JST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database through the REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Set the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets"
            exit 1
          fi
          for attempt in 1 2 3; do
            code=$(curl -sS -o body.txt -w '%{http_code}' \
              "${SUPABASE_URL}/rest/v1/site_settings?select=id&limit=1" \
              -H "apikey: ${SUPABASE_ANON_KEY}" || echo "000")
            echo "attempt ${attempt}: HTTP ${code} $(head -c 200 body.txt 2>/dev/null || true)"
            if [ "${code}" = "200" ]; then exit 0; fi
            sleep 30
          done
          # A failing run makes GitHub email you — usually it means the project is already paused.
          echo "::error::Supabase did not answer; the project may be paused. Restore it from the dashboard."
          exit 1
